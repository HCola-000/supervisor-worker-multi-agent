# 单元测试：导入并编译图，验证基本结构（不调用真实 API）

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch: # 允许在 GitHub UI 手动触发

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run unit tests
        env:
          # 占位值：单元测试只导入并编译图，不会真正调用模型
          BASE_URL: "http://localhost"
          API_KEY: "dummy-key"
        run: pytest tests/unit_tests
